# push 自检：与 CNB 的 .cnb/workflows/push.yml 对齐。
# 本仓库是纯 Node 插件，没有 Go / Wails / pnpm 构建步骤：
# 检出后直接用 Node 26 跑 test.mjs（插件逻辑自检），外加辅助脚本自检。
#
# https://github.com/actions/checkout
name: Push 自检

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# 同一分支的多次触发串行排队，不取消正在运行的旧任务。
concurrency:
  group: push-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/dtapps/golang:latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      - name: 插件逻辑自检
        run: node test.mjs

      - name: 辅助脚本自检
        run: node test-setup-registry.mjs
