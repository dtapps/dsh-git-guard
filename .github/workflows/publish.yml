# 发布工作流：与 CNB 的 .cnb/workflows/release.yml 对齐。
# 文件名用 publish.yml，避免与旧 release.yml 的 GitHub 缓存状态冲突。
# 纯 Node 插件，没有 Go / Wails 构建步骤。两种触发共用同一套步骤：
#   * 每天 UTC 00:00 定时发 nightly（VERSION=nightly 自动展开为 <最新正式版+1补丁>-nightly.<日期>）
#   * workflow_dispatch 手动填 version（semver 或 nightly）与 commit（留空用触发分支 HEAD）
#
# version 规则见 scripts/ci/resolve-version.sh。
# 两个 CI 各发各的制品库：CNB 流水线发到 CNB 制品库，这里发到 GitHub Packages。
# GitHub Packages 要求 scope 与仓库 owner（dtapps）一致，所以发布前把包名改成
# @dtapps/dsh-git-guard；CNB 制品库仍用 package.json 原有的 @dtapp/dsh-git-guard。
# 令牌用 secrets.GITHUB_TOKEN（需 packages: write）。
#
# npm 公共源（registry.npmjs.org）不在这里发：复制出来的 publish-npm.yml 用
# workflow_run 等这条工作流成功后，再把同一版本发到 npm 公共源。
#
# https://github.com/actions/checkout
# https://github.com/softprops/action-gh-release
name: Release Package

on:
  schedule:
    # GitHub 使用 UTC：每天 00:00（北京时间 08:00）。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号：1.2.3 / 1.2.3-rc.1 / 1.2.3-nightly.20260101；填 nightly 自动展开'
        required: true
        type: string
        default: nightly
      commit:
        description: '要发布的提交 SHA（留空用当前分支最新提交）'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write
  pull-requests: write
  # npm trusted publishing（OIDC）要求「调用方 + 被调用方」都给 id-token: write；
  # 这里给工作流级兜底，实际只用在下面对 publish-npm 的调用上。
  id-token: write

# 发布目标统一在这里维护。注意不要叫 NPM_REGISTRY：
# scripts/ci/resolve-version.sh 会用同名变量查基准版本，那必须继续指向 CNB 制品库。
env:
  PUBLISH_NAME: '@dtapps/dsh-git-guard'
  PUBLISH_SCOPE: '@dtapps'
  PUBLISH_REGISTRY: https://npm.pkg.github.com

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/dtapps/golang:latest
      env:
        GIT_SHIM_SAFE_DIRECTORY: 'true'
    # 解析出的版本号传给下面的 publish-npm（workflow_call），保证两边发的是同一个版本。
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      dist_tag: ${{ steps.version.outputs.DIST_TAG }}
      exists: ${{ steps.version_exists.outputs.exists }}
    env:
      VERSION: ${{ github.event_name == 'schedule' && 'nightly' || inputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      # 缓存同步下来的模板脚本；key 绑定仓库内脚本内容，脚本一改就换新缓存，
      # 避免旧缓存把已跟踪脚本（如 resolve-prerelease.sh）恢复成旧版本。
      - name: 缓存脚本
        uses: actions/cache@v6
        with:
          path: scripts/ci
          key: ci-scripts-${{ hashFiles('scripts/ci/**') }}

      - name: 同步脚本
        shell: bash
        run: make fetch-scripts

      # 容器镜像 ghcr.io/dtapps/golang 自带 Node/npm，不再用 setup-node 重复安装。
      # setup-node 的 registry-url 其实只做两件事，这里手写等价内容：
      #   1. 往 .npmrc 写 registry / @scope:registry，指定发布源；
      #   2. 写 //host/:_authToken=${NODE_AUTH_TOKEN}，npm publish 时据此带令牌。
      - name: 配置 npm 认证与发布 scope
        shell: bash
        run: |
          set -euo pipefail
          host="${PUBLISH_REGISTRY#https://}"
          host="${host%/}"
          npm config set registry "$PUBLISH_REGISTRY"
          npm config set "${PUBLISH_SCOPE}:registry" "$PUBLISH_REGISTRY"
          npm config set "//${host}/:_authToken" '${NODE_AUTH_TOKEN}'
          echo "npm $(npm -v) / node $(node -v)"
          cat "$HOME/.npmrc"

      - name: 切换到指定提交
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.commit }}" ]; then
            echo "built from ${{ inputs.commit }}"
          else
            echo "built from ${GITHUB_SHA}"
          fi

      - name: 解析版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/resolve-version.sh
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < .version.env

      # 包版本已存在则跳过后续全部步骤（工作流保持成功）。
      - name: 检查包版本是否已存在
        id: version_exists
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          set +e
          npm view "${PUBLISH_NAME}@${VERSION}" version --registry "$PUBLISH_REGISTRY" >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::notice::包版本 ${PUBLISH_NAME}@${VERSION} 已存在，后续发布步骤将跳过"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "包版本 ${PUBLISH_NAME}@${VERSION} 不存在，继续发布"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 包版本已存在，跳过后续步骤
        if: steps.version_exists.outputs.exists == 'true'
        shell: bash
        run: echo "::notice::包版本已存在，跳过后续全部步骤"

      # 重跑同一版本时先删掉旧的 Release 与 tag，保证下面能重新创建。
      - name: 删除同名旧 Release 与 tag（如果存在）
        if: steps.version_exists.outputs.exists != 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_TO_DELETE: ${{ steps.version.outputs.TAG }}
        run: sh scripts/ci/delete-release.sh --platform github --tag "$TAG_TO_DELETE"

      - name: 插件逻辑自检
        if: steps.version_exists.outputs.exists != 'true'
        run: node test.mjs

      - name: 辅助脚本自检
        if: steps.version_exists.outputs.exists != 'true'
        run: node test-setup-registry.mjs

      - name: 创建标签
        if: steps.version_exists.outputs.exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.TAG }}
          CNB_COMMIT: ${{ github.sha }}
        run: bash scripts/ci/nightly-tag.sh

      - name: 写入版本号与 GitHub Packages 包名
        if: steps.version_exists.outputs.exists != 'true'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.PACKAGE_VERSION;p.name=process.env.PUBLISH_NAME;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      # GitHub Packages 上的包内 README 用 GitHub 版；仓库里的 README.md 不变。
      # 源文件放在 docs/ 下：npm 会强制收录根目录所有 README* 文件，放根目录会被打进包里。
      # GitHub 发布内容里的 raw 链接固定到当前 tag，避免用户看到 /main/ 的漂移内容。
      # - name: 把 README 里的 GitHub main 链接改成当前版本
      #   if: steps.version_exists.outputs.exists != 'true'
      #   shell: bash
      #   env:
      #     TAG: ${{ steps.version.outputs.TAG }}
      #   run: |
      #     sed -i.bak "s|raw.githubusercontent.com/dtapps/dsh-git-guard/main/|raw.githubusercontent.com/dtapps/dsh-git-guard/${TAG}/|g" docs/README.github.md
      #     rm -f docs/README.github.md.bak

      - name: 使用 docs/README.github.md 覆盖 README.md
        if: steps.version_exists.outputs.exists != 'true'
        shell: bash
        run: cp docs/README.github.md README.md

      # Release 正文：README 的安装用法 + release-changelog.sh 生成的变更内容。
      - name: 生成 Release 正文
        if: steps.version_exists.outputs.exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.TAG }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          export COMMIT_URL="${REPO_URL}/commit"
          {
            echo "## 安装"
            echo
            awk '/^## 安装到 DeepSeekHarness/{flag=1;next}/^## 机制/{flag=0}flag' docs/README.github.md
            echo
            echo "## 更新内容"
            echo
            sh scripts/ci/release-changelog.sh "$TAG"
          } > release_body.md

      - name: 创建 Release
        if: steps.version_exists.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: DSHGitGuard ${{ steps.version.outputs.TAG }}
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # protect 保住正式版、latest/stable 与 rc/beta/alpha，避免 by_count 误删非 nightly 版本；
      # dry_run 必须显式为 false，否则插件默认只列出待删除版本。
      - name: 清理旧 nightly（只保留最近 3 个）
        if: steps.version_exists.outputs.exists != 'true'
        uses: dtapps/release-cleaner-action@main
        continue-on-error: true
        with:
          mode: by_count
          keep: 3
          protect: '^(v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)[.-]?[0-9A-Za-z.-]*)?|latest|stable)$'
          delete_git_tag: true
          dry_run: false

      # Release 已成功后再发布 npm；前面任一步失败都不会动制品库。
      - name: 发布到 GitHub Packages
        if: steps.version_exists.outputs.exists != 'true'
        shell: bash
        env:
          DIST_TAG: ${{ steps.version.outputs.DIST_TAG }}
        run: |
          set -euo pipefail
          set +e
          out="$(npm publish --tag "$DIST_TAG" --registry "$PUBLISH_REGISTRY" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            # 只有不带 -rc/-beta/-alpha/-nightly 后缀的正式版才该占 latest；
            # npm 对「首个版本」有兜底行为，这里核对一次，串了只告警不改写。
            latest="$(npm view "$PUBLISH_NAME" dist-tags.latest --registry "$PUBLISH_REGISTRY" 2>/dev/null || true)"
            echo "latest 当前指向：${latest:-<未设置>}（本次 dist-tag=${DIST_TAG}）"
            case "$latest" in
              *-*)
                if [ "$DIST_TAG" != "latest" ]; then
                  echo "::warning::latest 指向预发布版本 ${latest}；发一个正式版（无 -rc/-beta/-alpha/-nightly 后缀）即会自动纠正"
                fi
                ;;
            esac
            exit 0
          fi
          # npm 包版本不可变；同版本重跑时 tag / Release 已重建，包沿用已发布的即可。
          if printf '%s' "$out" | grep -Eqi 'previously published|already exists|existing version|409 conflict|E409'; then
            echo "::warning::包版本已存在，npm 不支持覆盖，沿用已发布版本"
            exit 0
          fi
          exit "$rc"

      # 发布后重建索引，用 Golang 镜像格式化，再创建 PR + 自动批准 + 合并。
      - name: 重建插件市场索引
        if: steps.version_exists.outputs.exists != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/update-index-pr.mjs --platform=github --build-only

      # - name: 格式化索引
      #   if: steps.version_exists.outputs.exists != 'true'
      #   continue-on-error: true
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     docker run --rm \
      #       --user "$(id -u):$(id -g)" \
      #       -e HOME=/tmp \
      #       -v "$GITHUB_WORKSPACE:/workspace" \
      #       -w /workspace \
      #       ghcr.io/dtapps/golang \
      #       make format

      - name: 创建索引更新 PR 并自动批准
        if: steps.version_exists.outputs.exists != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_APPROVE_TOKEN: ${{ secrets.PR_APPROVE_TOKEN }}
        run: node scripts/ci/update-index-pr.mjs --platform=github --skip-build

  # 复制出来的 npm 公共源工作流：Release 跑完后，把上面算好的版本号原样传进去。
  # 用 workflow_call 而不是 workflow_run，是为了避免重新猜版本（tag 反推会取错）。
  # 不在这里按主包 exists 跳过：npmjs 是独立源，是否已有该版本由 publish-npm.yml
  # 自己检查并决定跳过，避免外层误跳过导致 npmjs 漏发。
  publish-npm:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.release.outputs.version }}
      commit: ${{ inputs.commit || github.sha }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
