# CNB 云原生构建：npm 打包 + 发布 + Release 管理
#
# 只有两种触发方式，且共用同一条流水线（定义一次，见下面的 &pipeline 锚点）：
#   * crontab：每天 UTC 00:00（北京 08:00）自动跑，version 固定为 nightly。
#   * web_trigger：手动点按钮，页面表单填 version（semver 或 nightly）与 commit（见
#     .cnb/web_trigger.yml），注入为 $VERSION / $COMMIT。
#
# 入参 version 规则见 scripts/resolve-version.sh：
#   1.2.3                  -> 正式版，Release 不勾选 prerelease，npm dist-tag=latest
#   1.2.3-rc.1             -> 预发布（rc 渠道）
#   1.2.3-beta.1           -> 预发布（beta 渠道）
#   1.2.3-alpha.1          -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101 -> 预发布（nightly 渠道）
#   nightly                -> <最近正式版 + 1 补丁>-nightly.<UTC 日期>，每天一个 tag
#
# 仓库相关信息全部用 CNB 内置环境变量推导，不写死（见
# https://docs.cnb.cool/zh/build/build-in-env.md）：
#   * 制品库地址  https://npm.cnb.cool/${CNB_REPO_SLUG}/-/packages/
#   * 包名        读 package.json（兜底 @${CNB_GROUP_SLUG_LOWERCASE}/${CNB_REPO_NAME_LOWERCASE}）
#
# 公共 stage 用 YAML 锚点复用（同文件内允许；跨文件才不支持锚点）：
#   * .resolve / .test / .tag-nightly / .publish / .release
# 零依赖（test.mjs 是纯 Node），无需装依赖，直接用镜像自带的 node / npm。

# ---- 可复用的 stage 模板 ----
resolve: &resolve
  name: 解析版本
  image: node:26
  script: bash scripts/resolve-version.sh
  exports:
    VERSION: VERSION
    TAG: TAG
    CHANNEL: CHANNEL
    DIST_TAG: DIST_TAG
    PRERELEASE: PRERELEASE

test: &test
  name: 自检
  image: node:26
  script: node test.mjs

tag-nightly: &tag-nightly
  name: 创建 nightly 标签
  image: node:26
  script: bash scripts/nightly-tag.sh

publish: &publish
  name: 发布到制品库
  image: tencentcom/npm
  settings:
    token: $CNB_TOKEN
    registry: https://npm.cnb.cool/$CNB_REPO_SLUG/-/packages/
    folder: ./
    tag: $DIST_TAG
    access: public
    fail_on_version_conflict: true

release: &release
  name: 创建 Release
  image: node:26
  script: bash scripts/create-release.sh

# ---- 唯一的一条流水线：定时和手动共用同一份 stages ----
# 手动触发时若填了 commit，则先切到该提交；定时 / 留空时 COMMIT 为空，用默认分支 HEAD。
stages: &stages
  - name: 切换到指定提交
    image: node:26
    script: |
      if [ -n "${COMMIT:-}" ]; then
        git fetch --depth=1 origin "${COMMIT}"
        git checkout --detach "${COMMIT}"
        echo "built from ${COMMIT}"
      else
        echo "built from ${CNB_COMMIT_SHORT}"
      fi
  - *resolve
  - *test
  - *tag-nightly
  - *publish
  - *release

main:
  # 每天定时构建 nightly。平台时区 Asia/Shanghai，08:00 = UTC 00:00。
  # 定时固定发 nightly（env VERSION=nightly）；手动则由表单的 version 覆盖。
  "crontab: 0 8 * * *":
    - name: 定时发布 nightly
      env:
        VERSION: nightly
      stages: *stages

  # 手动执行：version 与 commit 由 .cnb/web_trigger.yml 的 inputs 表单注入。
  web_trigger_nightly:
    - name: 手动发布
      stages: *stages
