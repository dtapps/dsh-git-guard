# CNB 云原生构建：npm 打包 + 发布 + Release 管理
#
# 本文件由 .cnb.yml 的 include 引入，只负责发布：定时 nightly 与手动按钮。
# 两种触发共用同一份定义（见下面的 &publish_stages 与 &publish_job 锚点；CNB 不支持
# 跨文件锚点，所以整条 stages 必须留在本文件内）：
#   * crontab：每天 00:05 自动跑，不注入 version，脚本兜底成 nightly。
#   * web_trigger：手动点按钮，页面表单填 version（semver 或 nightly）与 commit（见
#     .cnb/web_trigger.yml），直接用别名 *publish_job 引用同一份 job。CNB 按 input key
#     原样注入环境变量，即小写 $version / $commit；scripts/ci/resolve-version.sh 的优先级
#     是 $VERSION > $version，所以 job env 里不能写死 VERSION，否则手动填的版本会失效。
#
# 入参 version 规则见 scripts/ci/resolve-version.sh：
#   1.2.3                  -> 正式版，Release 不勾选 prerelease，npm dist-tag=latest
#   1.2.3-rc.1             -> 预发布（rc 渠道）
#   1.2.3-beta.1           -> 预发布（beta 渠道）
#   1.2.3-alpha.1          -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101 -> 预发布（nightly 渠道）
#   nightly                -> <最近正式版 + 1 补丁>-nightly.<UTC 日期>，每天一个 tag
#
# 版本与包名用 CNB 内置环境变量推导（见
# https://docs.cnb.cool/zh/build/build-in-env.md）；制品库地址需写死，见下：
#   * 制品库地址  https://npm.cnb.cool/dtapp/dsh/-/packages/
#     （通用 npm 制品库 dsh，独立于 git 仓库名 dsh-git-guard；以后其他插件包也发到这里，
#       故不能由 $CNB_REPO_SLUG 推导，写死为实际创建的制品库路径）
#   * 包名        读 package.json（兜底 @${CNB_GROUP_SLUG_LOWERCASE}/${CNB_REPO_NAME_LOWERCASE}）
#   * 发布令牌    用云原生构建内置 $CNB_TOKEN（见 publish stage）
# 零依赖（test.mjs 是纯 Node），无需装依赖，直接用镜像自带的 node / npm。
# ---- 唯一的一条流水线：定时和手动共用同一份 stages ----
# 手动触发时若填了 commit，则先切到该提交；定时 / 留空时 COMMIT 为空，用默认分支 HEAD。
stages: &publish_stages
  - name: 同步脚本
    script: |
      # 卷会整体挂载 scripts/ci，先把本次提交里跟踪的脚本还原（未跟踪的模板脚本由缓存/下载提供）
      git checkout -- scripts/ci
      make fetch-scripts

  - name: 切换到指定提交
    script: |
      set -e
      if [ -n "${COMMIT:-}" ]; then
        git fetch --depth=1 origin "${COMMIT}"
        git checkout --detach "${COMMIT}"
        echo "built from ${COMMIT}"
      else
        echo "built from ${CNB_COMMIT_SHORT}"
      fi

  - name: 解析版本
    script: bash scripts/ci/resolve-version.sh
    exports:
      VERSION: VERSION
      TAG: TAG
      CHANNEL: CHANNEL
      DIST_TAG: DIST_TAG
      PRERELEASE: PRERELEASE

  # 包版本已存在则跳过后续全部步骤（工作流保持成功）。
  - name: 检查包版本是否已存在
    script: |
      set -e
      EXISTS="$(node -e '
        const name = process.env.PUBLISH_NAME;
        const version = process.env.VERSION;
        const registry = process.env.PUBLISH_REGISTRY.replace(/\/+$/, "") + "/";
        const url = registry + name.replace(/\//g, "%2F");
        fetch(url, { headers: { accept: "application/json", authorization: `Bearer ${process.env.CNB_TOKEN}` } })
          .then(r => (r.ok ? r.json() : {}))
          .then(j => process.stdout.write(j.versions && j.versions[version] ? "true" : "false"))
          .catch(() => process.stdout.write("false"));
      ')"
      echo "$EXISTS"
      echo "##[set-output EXISTS=${EXISTS}]"
    exports:
      VERSION_EXISTS: EXISTS

  - name: 包版本已存在，跳过后续步骤
    if: |
      [ "$VERSION_EXISTS" = "true" ]
    script: echo "包版本已存在，跳过后续全部步骤"

  # 重跑同一版本时先删掉旧的 Release 与 tag，保证下面能重新创建。
  # tag 也可能已经被删过，这里允许失败，不阻断发布。
  - name: 删除同名旧 Release 与 tag（如果存在）
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    allowFailure: true
    script: sh scripts/ci/delete-release.sh --platform cnb --tag "$TAG"

  - name: 自检
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    script: node test.mjs

  - name: 创建 nightly 标签
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    script: bash scripts/ci/nightly-tag.sh

  # CNB 发布内容里的 raw 链接固定到当前 tag，避免用户看到 /main/ 的漂移内容。
  # - name: 把 README 里的 CNB main 链接改成当前版本
  #   if: |
  #     [ "$VERSION_EXISTS" != "true" ]
  #   script: |
  #     sed -i.bak "s|/-/git/raw/main/|/-/git/raw/${TAG}/|g" README.md
  #     rm -f README.md.bak

  - name: 写入版本号与包名到 package.json
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    script: |
      set -e
      node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.VERSION;p.name=process.env.PUBLISH_NAME;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

  # 提前把 scope 映射写进工作区 .npmrc，让发布插件按统一 registry 解析 @dtapp 包。
  - name: 配置 npm scope
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    script: |
      set -e
      printf '%s:registry=%s\n' "$PUBLISH_SCOPE" "$PUBLISH_REGISTRY" > .npmrc

  # Release 正文：README 的安装用法 + release-changelog.sh 生成的变更内容。
  - name: 生成 Release 正文
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    script: |
      set -e
      REPO_URL="https://cnb.cool/${CNB_REPO_SLUG}"
      COMMIT_URL="${REPO_URL}/-/commit"
      RELEASE_TITLE="DSHGitGuard ${TAG}"
      if [ "$PRERELEASE" = "false" ]; then MAKE_LATEST=true; else MAKE_LATEST=false; fi
      export COMMIT_URL REPO_URL RELEASE_TITLE MAKE_LATEST
      echo "##[set-output RELEASE_TITLE=${RELEASE_TITLE}]"
      echo "##[set-output MAKE_LATEST=${MAKE_LATEST}]"
      {
        echo "## 安装"
        echo
        awk '/^## 安装到 DeepSeekHarness/{flag=1;next}/^## 机制/{flag=0}flag' README.md
        echo
        echo "## 更新内容"
        echo
        sh scripts/ci/release-changelog.sh "$TAG"
      } > release_body.md
    exports:
      RELEASE_TITLE: RELEASE_TITLE
      MAKE_LATEST: MAKE_LATEST

  # 官方插件：Release 已存在时默认删除后重建（overlying: false）。
  - name: 创建 Release
    type: git:release
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    options:
      tag: $TAG
      title: $RELEASE_TITLE
      descriptionFromFile: release_body.md
      preRelease: $PRERELEASE
      latest: $MAKE_LATEST

  # protect 保住正式版、latest/stable 与 rc/beta/alpha，避免 by_count 误删非 nightly 版本；
  # dry_run 必须显式为 false，否则插件默认只列出待删除版本。
  - name: 清理旧 nightly（只保留最近 3 个）
    image: docker.cnb.cool/dtapp/plugins/release-cleaner:latest
    allowFailure: true
    settings:
      mode: by_count
      keep: 3
      protect: '^(v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)[.-]?[0-9A-Za-z.-]*)?|latest|stable)$'
      delete_git_tag: true
      dry_run: false

  # Release 已成功后再发布 npm；前面任一步失败都不会动制品库。
  - name: 发布到制品库
    image: tencentcom/npm
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    settings:
      username: $CNB_TOKEN_USER_NAME
      token: $CNB_TOKEN
      email: $CNB_COMMITTER_EMAIL
      registry: $PUBLISH_REGISTRY
      folder: ./
      tag: $DIST_TAG
      access: public
      fail_on_version_conflict: false

  # 发布后重建索引，用 Golang 镜像格式化，再创建 PR + 自动批准 + 合并。
  - name: 重建插件市场索引
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    script: node scripts/ci/update-index-pr.mjs --platform=cnb --build-only

  # - name: 格式化索引
  #   image: docker.cnb.cool/dtapp/golang
  #   if: |
  #     [ "$VERSION_EXISTS" != "true" ]
  #   allowFailure: true
  #   script: make format

  - name: 准备索引更新分支
    if: |
      [ "$VERSION_EXISTS" != "true" ]
    script: |
      set -e
      node scripts/ci/update-index-pr.mjs --platform=cnb --prepare-only
      if [ -f .index-pr-branch ]; then
        INDEX_BRANCH="$(cat .index-pr-branch)"
        echo "##[set-output INDEX_BRANCH=${INDEX_BRANCH}]"
      fi
    exports:
      INDEX_BRANCH: INDEX_BRANCH

  - name: 创建索引更新 PR
    image: cnbcool/create-pr:latest
    if: |
      [ -n "$INDEX_BRANCH" ]
    settings:
      target_branch: main
      head_branch: $INDEX_BRANCH
      title: 'chore: 更新插件市场索引源到 $VERSION'
      body: |
        发布 $VERSION 后自动重建插件市场索引。

main:

  # 定时（每天 00:05）与手动（web_trigger 按钮）共用同一份 job 定义：
  # 定时任务挂在 YAML 锚点上，手动触发直接用别名整份引用，避免两处重复维护。
  # 注意：job env 里不能写死 VERSION —— resolve-version.sh 的优先级是
  # $VERSION（大写，定时任务用）> $version（表单按 input key 原样注入的小写变量），
  # 写死 VERSION 会让手动填的版本失效。定时任务不注入 version，脚本兜底为 nightly。
  'crontab: 5 0 * * *':
    - &publish_job
      name: 发布
      env:
        GIT_SHIM_SAFE_DIRECTORY: 'true'
        PUBLISH_NAME: '@dtapp/dsh-git-guard'
        PUBLISH_SCOPE: '@dtapp'
        PUBLISH_REGISTRY: https://npm.cnb.cool/dtapp/dsh/-/packages/
      runner:
        tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
      services:
        - docker # 启用 Docker 服务（用于 docker build/push）
      docker:
        image: docker.cnb.cool/dtapp/golang:latest # 统一使用预构建的 CI 环境镜像
        volumes:
          - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
          - ./scripts/ci:copy-on-write # 模板脚本缓存；卷会整体挂载该目录，同步前需先还原跟踪文件
      # NPC 开关：npc.yml 提供 NPC_ENABLED=true；改成 false 可全局关闭 NPC 派活。
      imports: https://cnb.cool/dtapp/envs/-/blob/main/npc.yml
      stages: *publish_stages

  # 手动执行：version 与 commit 由 .cnb/web_trigger.yml 的 inputs 表单注入。
  web_trigger_publish:
    - *publish_job

  # 索引 PR 先做确定性校验，再由 NPC「索引审查员」审查并批准；
  # 分支保护的 NPC 评审要求只能由 NPC 批准来满足。
  pull_request:
    - name: 索引更新 PR NPC 审查
      imports:
        - https://cnb.cool/dtapp/envs/-/blob/main/npc.yml
        - https://cnb.cool/dtapp/envs/-/blob/main/dsh-git-guard.yml
      ifModify:
        - market/index.json
      stages:
        - name: 确定性校验索引与插件逻辑
          image: node:26
          script: |
            set -e
            node test.mjs
            node .cnb/scripts/verify-index.mjs
        - name: NPC 审查并批准
          if: |
            [ "$NPC_ENABLED" = "true" ]
          docker:
            image: cnbcool/default-npc:latest
          type: npc:go
          options:
            role: 索引审查员
            systemPrompt: 你是 dsh-git-guard 仓库的自动化审查助手，只审查 market/index.json 的更新，严格遵守角色指令。
            userPrompt: 请按「索引审查员」的职责审查当前 PR。PR 编号在环境变量 CNB_PULL_REQUEST_IID 中，仓库在 CNB_REPO_SLUG 中，校验通过后按角色指令调用 approve 接口批准，不通过则提交
              REQUEST_CHANGES 评审。
            maxTurns: 60

  # 前置条件：main 分支保护必须勾选「需要评审人批准」，否则本事件不会触发。
  pull_request.mergeable:
    - name: 自动合并索引更新 PR
      ifModify:
        - market/index.json
      stages:
        - name: 自动合并
          type: git:auto-merge
          options:
            mergeType: squash
            removeSourceBranch: true
            ignoreAssignee: true

